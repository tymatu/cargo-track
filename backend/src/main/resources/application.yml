spring:
  application:
    name: cargotrack

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cargotrack}
    username: ${DB_USER:cargotrack}
    password: ${DB_PASSWORD:cargotrack}

  jpa:
    hibernate:
      ddl-auto: validate # схемой управляет только Flyway
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
