spring:
  application:
    name: cargotrack
  profiles:
    default: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cargotrack}
    username: ${DB_USER:cargotrack}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # Schema is managed by Flyway only.
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # In prod the secret must come from the JWT_SECRET environment variable.
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pricing:
    base: ${PRICING_BASE:5.00}       # EUR per parcel.
    per-kg: ${PRICING_PER_KG:0.50}   # EUR per billable kg.
    per-km: ${PRICING_PER_KM:0.05}   # EUR per route km.

  routing:
    base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    osrm-enabled: ${OSRM_ENABLED:true}
    connect-timeout: ${OSRM_CONNECT_TIMEOUT:2s}
    read-timeout: ${OSRM_READ_TIMEOUT:4s}
    fallback-points: ${ROUTE_FALLBACK_POINTS:60}
  simulation:
    enabled: ${SIMULATION_ENABLED:true}
    speed-kmh: ${SIMULATION_SPEED_KMH:65}
    time-scale: ${SIMULATION_TIME_SCALE:60}
    tick-delay: ${SIMULATION_TICK_DELAY:2s}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
    life-enabled: ${DEMO_LIFE_ENABLED:true}
    life-initial-delay: ${DEMO_LIFE_INITIAL_DELAY:30s}
    life-delay: ${DEMO_LIFE_DELAY:45s}
  auth-rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${AUTH_RATE_LIMIT_REFILL_TOKENS:20}
    refill-period: ${AUTH_RATE_LIMIT_REFILL_PERIOD:1m}
    bucket-ttl: ${AUTH_RATE_LIMIT_BUCKET_TTL:15m}

---
spring:
  config:
    activate:
      on-profile: prod

# Swagger UI is disabled in prod.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
