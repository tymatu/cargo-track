services:
  postgres:
    image: postgres:16-alpine
    container_name: cargotrack-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cargotrack}
      POSTGRES_USER: ${DB_USER:-cargotrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cargotrack}
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локально установленным PostgreSQL
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cargotrack} -d ${DB_NAME:-cargotrack}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cargotrack-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cargotrack.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
